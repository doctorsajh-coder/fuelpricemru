name: Update Mauritius fuel prices

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - ".github/workflows/update-fuel-prices.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch and parse STC retail prices
        run: |
          python3 - <<'PY'
          import html
          import json
          import re
          import urllib.request
          from pathlib import Path

          url = "https://www.stcmu.com/ppm/retail-prices"
          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0 (compatible; FuelPriceMRU/1.0)",
                  "Accept": "text/html,application/xhtml+xml"
              }
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              raw = response.read().decode("utf-8", errors="replace")

          text = html.unescape(re.sub(r"<[^>]+>", " ", raw))
          text = re.sub(r"\s+", " ", text).strip()

          pattern = re.compile(
              r"(\d{1,2}[- ](?:January|February|March|April|May|June|July|August|September|October|November|December)[- ]\d{4})"
              r".{0,500}?(\d{2,3}\.\d{2}).{0,100}?(\d{2,3}\.\d{2})",
              re.I
          )

          match = pattern.search(text)
          if not match:
              raise SystemExit("Could not find STC retail-price table")

          date, mogas, gasoil = match.groups()
          mogas = float(mogas)
          gasoil = float(gasoil)

          if not (30 < mogas < 200 and 30 < gasoil < 200):
              raise SystemExit(f"Suspicious prices: {mogas}, {gasoil}")

          out = {
              "source": "State Trading Corporation",
              "sourceUrl": url,
              "date": date,
              "prices": {
                  "mogas": {"price": mogas, "date": date},
                  "gasoil": {"price": gasoil, "date": date}
              }
          }

          Path("data").mkdir(exist_ok=True)
          Path("data/fuel-prices.json").write_text(
              json.dumps(out, indent=2) + "\n",
              encoding="utf-8"
          )
          print(json.dumps(out, indent=2))
          PY

      - name: Commit changed price data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fuel-prices.json
          if git diff --cached --quiet; then
            echo "No fuel-price change."
            exit 0
          fi
          git commit -m "Update Mauritius fuel prices"
          git push
