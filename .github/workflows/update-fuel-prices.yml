name: Update Mauritius fuel prices

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - ".github/workflows/update-fuel-prices.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch and parse STC retail prices
        run: |
          python3 - <<'PY'
          import json
          import re
          import urllib.request
          from html.parser import HTMLParser
          from pathlib import Path
          from datetime import datetime

          URL = "https://www.stcmu.com/ppm/retail-prices"

          class TableParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.rows = []
                  self.current_row = None
                  self.current_cell = None
                  self.current_text = []

              def handle_starttag(self, tag, attrs):
                  tag = tag.lower()
                  if tag == "tr":
                      self.current_row = []
                  elif tag in ("td", "th") and self.current_row is not None:
                      self.current_cell = []
                      self.current_text = []

              def handle_data(self, data):
                  if self.current_cell is not None:
                      self.current_text.append(data)

              def handle_endtag(self, tag):
                  tag = tag.lower()
                  if tag in ("td", "th") and self.current_row is not None and self.current_cell is not None:
                      value = re.sub(r"\s+", " ", "".join(self.current_text)).strip()
                      self.current_row.append(value)
                      self.current_cell = None
                      self.current_text = []
                  elif tag == "tr" and self.current_row is not None:
                      self.rows.append(self.current_row)
                      self.current_row = None

          req = urllib.request.Request(
              URL,
              headers={
                  "User-Agent": "Mozilla/5.0 (compatible; FuelPriceMRU/1.0)",
                  "Accept": "text/html,application/xhtml+xml"
              }
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              raw = response.read().decode("utf-8", errors="replace")

          parser = TableParser()
          parser.feed(raw)

          date_re = re.compile(
              r"^(\d{1,2})[- ](January|February|March|April|May|June|July|August|September|October|November|December)[- ](\d{4})$",
              re.I
          )

          candidates = []
          for row in parser.rows:
              if len(row) < 3:
                  continue

              date_match = date_re.match(row[0].strip())
              if not date_match:
                  continue

              try:
                  date = datetime.strptime(row[0].strip().replace("-", " "), "%d %B %Y")
                  mogas = float(row[1].replace(",", ""))
                  gasoil = float(row[2].replace(",", ""))
              except ValueError:
                  continue

              if 30 < mogas < 200 and 30 < gasoil < 200:
                  candidates.append((date, row[0].strip(), mogas, gasoil))

          if not candidates:
              raise SystemExit("Could not find a valid STC retail-price table row")

          _, date, mogas, gasoil = max(candidates, key=lambda item: item[0])

          out = {
              "source": "State Trading Corporation",
              "sourceUrl": URL,
              "date": date,
              "prices": {
                  "mogas": {"price": mogas, "date": date},
                  "gasoil": {"price": gasoil, "date": date}
              }
          }

          Path("data").mkdir(exist_ok=True)
          Path("data/fuel-prices.json").write_text(
              json.dumps(out, indent=2) + "\n",
              encoding="utf-8"
          )
          print(json.dumps(out, indent=2))
          PY

      - name: Commit changed price data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fuel-prices.json
          if git diff --cached --quiet; then
            echo "No fuel-price change."
            exit 0
          fi
          git commit -m "Update Mauritius fuel prices"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
